name: Screenshots

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/scripts/screenshots.sh
      - .github/workflows/screenshots.yml

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Download latest APK
        run: |
          url=$(curl -s https://api.github.com/repos/${{ github.repository }}/releases/latest \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['assets'][0]['browser_download_url'])")
          curl -fL -o app.apk "$url"
          ls -lh app.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run app on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disk-size: 6000M
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: .github/scripts/screenshots.sh app.apk shots

      - name: Publish screenshots to the "screenshots" branch
        if: always()
        run: |
          cd shots
          git init -q -b screenshots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "App screenshots"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screenshots
