name: Build offline APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rebuild_data:
        description: "Download fresh OpenStreetMap data (ignore cache)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Data cache key (refreshes every week)
        id: key
        run: echo "data=mpdata-v1-${{ hashFiles('tools/*.py', 'tools/*.sh') }}-$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Restore offline map data
        id: cache
        if: ${{ !inputs.rebuild_data }}
        uses: actions/cache/restore@v4
        with:
          path: |
            app/src/main/assets/mp.map
            app/src/main/assets/mp.graph
            app/src/main/assets/places.tsv
            app/src/main/assets/data_version.txt
          key: ${{ steps.key.outputs.data }}

      - name: Install map tools
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q osmium-tool
          pip install osmium numpy

      - name: Build Madhya Pradesh offline data (map, routing, search)
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          df -h .
          JAVA_HEAP=10g tools/build_data.sh
          rm -rf build-data/source.osm.pbf

      - name: Save offline map data
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            app/src/main/assets/mp.map
            app/src/main/assets/mp.graph
            app/src/main/assets/places.tsv
            app/src/main/assets/data_version.txt
          key: ${{ steps.key.outputs.data }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key (optional, from repo secrets)
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Unit tests + build APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ls -lh app/src/main/assets
          ./gradlew --no-daemon testDebugUnitTest assembleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/BikeRidingMP-$(cat app/src/main/assets/data_version.txt | cut -c1-8).apk"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: BikeRidingMP-apk
          path: dist/*.apk
          compression-level: 0

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Bike Riding MP – build ${{ github.run_number }}
          make_latest: true
          body: |
            Offline map + routing + search for Madhya Pradesh, all inside the APK.
            Install: download the .apk below on your phone and open it (allow "Install unknown apps").
            Map data © OpenStreetMap contributors (ODbL).
          files: dist/*.apk
