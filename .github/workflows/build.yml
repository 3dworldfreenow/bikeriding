name: Build offline APK

on:
  push:
    branches: [main]
    paths-ignore:
      - .github/scripts/**
      - .github/workflows/screenshots.yml
      - docs/**
  workflow_dispatch:
    inputs:
      rebuild_data:
        description: "Download fresh OpenStreetMap data (ignore cache)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    # fast check without map data (a few minutes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Data cache keys (refresh every week)
        id: key
        run: |
          W=$(date -u +%G-%V)
          echo "graph=mpgraph-v2-${{ hashFiles('tools/graphlib.py', 'tools/build_graph.py', 'tools/pick_boundary.py', 'tools/build_data.sh') }}-$W" >> "$GITHUB_OUTPUT"
          echo "tiles=mptiles-v1-${{ hashFiles('tools/build_tiles.sh', 'tools/make_style.py', 'tools/pick_boundary.py', 'tools/build_data.sh') }}-$W" >> "$GITHUB_OUTPUT"

      - name: Restore routing + search data
        id: graphcache
        if: ${{ !inputs.rebuild_data }}
        uses: actions/cache/restore@v4
        with:
          path: |
            app/src/main/assets/mp.graph
            app/src/main/assets/places.tsv
            app/src/main/assets/data_version.txt
          key: ${{ steps.key.outputs.graph }}

      - name: Restore map tiles + style
        id: tilescache
        if: ${{ !inputs.rebuild_data }}
        uses: actions/cache/restore@v4
        with:
          path: |
            app/src/main/assets/mp.pmtiles
            app/src/main/assets/mapstyle
          key: ${{ steps.key.outputs.tiles }}

      - name: What needs building
        id: parts
        run: |
          P=""
          [ "${{ steps.graphcache.outputs.cache-hit }}" = "true" ] || P="$P graph"
          [ "${{ steps.tilescache.outputs.cache-hit }}" = "true" ] || P="$P tiles"
          echo "parts=$P" >> "$GITHUB_OUTPUT"
          echo "building:$P"

      - name: Install map tools
        if: steps.parts.outputs.parts != ''
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q osmium-tool
          pip install osmium numpy pyshp

      - name: Build Madhya Pradesh offline data
        if: steps.parts.outputs.parts != ''
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PARTS: ${{ steps.parts.outputs.parts }}
        run: |
          df -h .
          JAVA_HEAP=10g tools/build_data.sh
          rm -rf build-data

      - name: Save routing + search data
        if: steps.graphcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            app/src/main/assets/mp.graph
            app/src/main/assets/places.tsv
            app/src/main/assets/data_version.txt
          key: ${{ steps.key.outputs.graph }}

      - name: Save map tiles + style
        if: steps.tilescache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            app/src/main/assets/mp.pmtiles
            app/src/main/assets/mapstyle
          key: ${{ steps.key.outputs.tiles }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key (optional, from repo secrets)
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Unit tests + build APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ls -lh app/src/main/assets
          ./gradlew --no-daemon testDebugUnitTest assembleRelease
          mkdir -p dist
          NAME="BikeRidingMP-$(cat app/src/main/assets/data_version.txt | cut -c1-8)"
          cp app/build/outputs/apk/release/app-release.apk "dist/$NAME.apk"
          cd dist
          # same APK as one .zip (for phones/browsers that block .apk downloads)
          zip -9 -j "$NAME.zip" "$NAME.apk"
          # and split into 50 MB parts for slow connections (open the .zip part with ZArchiver)
          mkdir -p parts
          zip -9 -s 50m "parts/$NAME-parts.zip" "$NAME.apk"
          ls -lh . parts

      - uses: actions/upload-artifact@v4
        with:
          name: BikeRidingMP-apk
          path: dist/*.apk
          compression-level: 0

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Bike Riding MP – build ${{ github.run_number }}
          make_latest: true
          body: |
            Offline map + routing + search for Madhya Pradesh, all inside the APK (satellite view needs internet or a saved area).

            **Download one of these:**
            - `.apk` – open it on the phone and install (allow "Install unknown apps").
            - `.zip` – same APK zipped, if your phone/browser stops the .apk download. Open it in the Files app, extract, then tap the .apk.
            - `-parts.z01`, `-parts.z02`, … + `-parts.zip` – small 50 MB pieces for slow internet. Download ALL pieces into the same folder, open the `-parts.zip` with ZArchiver → Extract, then tap the .apk.
            Map data © OpenStreetMap contributors (ODbL).
          files: |
            dist/*.apk
            dist/*.zip
            dist/parts/*
